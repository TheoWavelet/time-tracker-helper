<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Time Tracker Bridge — Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
        max-width: 420px;
        color: #1c1917;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
      }
      input {
        width: 100%;
        padding: 6px 8px;
        font-size: 13px;
        box-sizing: border-box;
      }
      button {
        margin-top: 10px;
        padding: 6px 14px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #16a34a;
      }
    </style>
  </head>
  <body>
    <h3>Time Tracker Bridge</h3>
    <label for="token">Pairing token (copy from the Time Tracker dashboard)</label>
    <input id="token" type="text" placeholder="Paste pairing token here" />
    <button id="save">Save</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
